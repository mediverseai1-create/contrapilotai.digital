<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contractpilot — See what your contracts are actually saying</title>
<meta name="description" content="Upload a contract. Contractpilot flags the risks, missing terms, and unusual clauses in plain English — before you sign.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='5' y='2' width='22' height='28' rx='1' fill='%231A1D24'/><rect x='9' y='9' width='14' height='1.6' fill='%23E0BC5D'/><rect x='8' y='19' width='16' height='2.6' fill='%23B94A34'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300;0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  /* =========================================================
     Design tokens — Vellum & Redline
     ========================================================= */
  :root {
    --ink:          #1A1D24;
    --ink-soft:     #3A3D46;
    --ink-mute:     #6C6E76;
    --vellum:       #EDE7DA;
    --vellum-soft:  #F5F0E5;
    --vellum-warm:  #E5DFD1;
    --page:         #FBF8F1;
    --aubergine:    #2C1D3E;
    --aubergine-2:  #372748;
    --redline:      #B94A34;
    --redline-soft: #E4C6BC;
    --highlighter:  #E0BC5D;
    --sage:         #6B7F5F;
    --rule:         #C4BCA8;
    --rule-soft:    #D9D1BE;
    --white:        #FFFFFF;

    --serif: 'Newsreader', 'Cormorant Garamond', 'Iowan Old Style', 'Palatino', Georgia, serif;
    --sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', Menlo, Consolas, monospace;

    --measure: 68ch;
    --gutter: clamp(20px, 4vw, 40px);
    --section-y: clamp(72px, 10vw, 128px);
  }

  /* =========================================================
     Reset + base
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background: var(--vellum);
    font-size: 16px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    text-rendering: optimizeLegibility;
  }
  img, svg { display: block; max-width: 100%; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  input, textarea, select { font: inherit; color: inherit; }
  a { color: inherit; text-decoration: none; }
  ::selection { background: var(--redline); color: var(--vellum-soft); }

  /* =========================================================
     Typography
     ========================================================= */
  .display {
    font-family: var(--serif);
    font-weight: 400;
    letter-spacing: -0.018em;
    line-height: 1.02;
    font-optical-sizing: auto;
  }
  h1, h2, h3, h4 { margin: 0; font-weight: 500; }
  .eyebrow {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-mute);
  }
  .eyebrow.on-dark { color: var(--vellum-warm); opacity: 0.75; }
  .eyebrow .accent { color: var(--redline); }
  .sec-num {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.06em;
    color: var(--ink-mute);
  }

  /* =========================================================
     Layout primitives
     ========================================================= */
  .wrap { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter); }
  .wrap-narrow { max-width: 880px; }
  .section { padding: var(--section-y) 0; }
  .section + .section { border-top: 1px solid var(--rule-soft); }

  /* =========================================================
     Button system
     ========================================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 22px;
    border-radius: 2px;
    font-size: 15px;
    font-weight: 500;
    letter-spacing: -0.005em;
    line-height: 1;
    transition: transform .12s ease, background .15s ease, color .15s ease, border-color .15s ease;
    white-space: nowrap;
  }
  .btn:active { transform: translateY(1px); }
  .btn-primary { background: var(--ink); color: var(--vellum-soft); }
  .btn-primary:hover { background: #000; }
  .btn-vellum { background: var(--vellum-soft); color: var(--ink); }
  .btn-vellum:hover { background: var(--white); }
  .btn-ghost { color: var(--ink); border: 1px solid var(--ink); background: transparent; }
  .btn-ghost:hover { background: var(--ink); color: var(--vellum-soft); }
  .btn-ghost-dark { color: var(--vellum-soft); border: 1px solid var(--vellum-warm); background: transparent; }
  .btn-ghost-dark:hover { background: var(--vellum-soft); color: var(--ink); }
  .btn-quiet { color: var(--ink); padding: 10px 0; }
  .btn-quiet:hover { color: var(--redline); }
  .btn-sm { padding: 9px 14px; font-size: 13px; }
  .btn-block { width: 100%; }

  /* =========================================================
     Navigation
     ========================================================= */
  .nav {
    position: sticky; top: 0; z-index: 50;
    background: var(--aubergine);
    color: var(--vellum-soft);
  }
  .nav-inner {
    display: flex; align-items: center; justify-content: space-between;
    height: 68px;
    max-width: 1240px; margin: 0 auto; padding: 0 var(--gutter);
    gap: 24px;
  }
  .nav.on-light { background: var(--vellum); color: var(--ink); border-bottom: 1px solid var(--rule-soft); }
  .nav.on-light .nav-links a { color: var(--ink-soft); }
  .nav.on-light .nav-links a:hover { color: var(--ink); }
  .nav.on-light .btn-vellum { background: var(--ink); color: var(--vellum-soft); }
  .nav.on-light .btn-vellum:hover { background: #000; }
  .nav.on-light .btn-ghost-dark { color: var(--ink); border-color: var(--ink); }
  .nav.on-light .btn-ghost-dark:hover { background: var(--ink); color: var(--vellum-soft); }
  .nav-brand { display: flex; align-items: center; gap: 10px; font-family: var(--serif); font-size: 22px; font-weight: 500; letter-spacing: -0.01em; }
  .nav-brand .mark { width: 22px; height: 28px; position: relative; }
  .nav-brand .mark .page { position: absolute; inset: 0; background: currentColor; border-radius: 1px; }
  .nav-brand .mark .title-rule { position: absolute; left: 4px; top: 7px; width: 12px; height: 1.4px; background: var(--highlighter); opacity: .85; }
  .nav-brand .mark .redline { position: absolute; left: 3px; top: 18px; width: 16px; height: 2.4px; background: var(--redline); }
  .nav-links { display: flex; gap: 28px; align-items: center; }
  .nav-links a { font-size: 14px; color: var(--vellum-warm); transition: color .15s ease; }
  .nav-links a:hover { color: var(--vellum-soft); }
  .nav-actions { display: flex; align-items: center; gap: 12px; }
  .nav-toggle { display: none; }

  /* =========================================================
     Hero
     ========================================================= */
  .hero {
    background: var(--aubergine);
    color: var(--vellum-soft);
    padding: clamp(56px, 9vw, 96px) 0 clamp(72px, 12vw, 120px);
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    /* subtle vellum grain */
    content: '';
    position: absolute; inset: 0;
    background-image: radial-gradient(circle at 12% 20%, rgba(224,188,93,0.09), transparent 45%),
                       radial-gradient(circle at 88% 80%, rgba(185,74,52,0.10), transparent 45%);
    pointer-events: none;
  }
  .hero-inner { position: relative; z-index: 1; text-align: center; max-width: 980px; margin: 0 auto; padding: 0 var(--gutter); }
  .hero-eyebrow { margin-bottom: 28px; }
  .hero h1 {
    font-size: clamp(44px, 7vw, 84px);
    line-height: 0.98;
    letter-spacing: -0.022em;
    margin: 0 0 28px;
    color: var(--vellum-soft);
  }
  .hero h1 em { font-style: italic; color: var(--redline); font-weight: 400; }
  .hero-sub {
    font-size: clamp(16px, 1.7vw, 19px);
    line-height: 1.5;
    color: var(--vellum-warm);
    max-width: 640px;
    margin: 0 auto 40px;
  }
  .hero-cta { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .hero-meta {
    margin-top: 28px;
    display: flex; justify-content: center; gap: 24px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--vellum-warm); opacity: 0.6;
  }
  .hero-meta span::before { content: '·'; margin-right: 24px; opacity: 0.5; }
  .hero-meta span:first-child::before { display: none; }

  /* =========================================================
     Hero signature — the redline sample
     ========================================================= */
  .redline-sample {
    margin: 64px auto 0;
    max-width: 880px;
    background: var(--page);
    color: var(--ink);
    border: 1px solid var(--rule);
    box-shadow: 0 24px 60px -20px rgba(0,0,0,0.4), 0 4px 12px -4px rgba(0,0,0,0.2);
    text-align: left;
    position: relative;
    display: grid;
    grid-template-columns: 1fr 300px;
  }
  .redline-sample-body {
    padding: 40px 36px 40px 44px;
    border-right: 1px solid var(--rule-soft);
  }
  .redline-sample-head {
    display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px;
    padding-bottom: 16px; border-bottom: 1px solid var(--rule-soft);
  }
  .redline-sample-head .section-tag {
    font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--ink);
    letter-spacing: 0.02em;
  }
  .redline-sample-head .clause-name {
    font-family: var(--serif); font-size: 17px; font-weight: 500; color: var(--ink-soft);
    font-style: italic;
  }
  .redline-sample-head .doc-label {
    margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--ink-mute);
  }
  .redline-sample-para {
    font-family: var(--serif);
    font-size: 17px; line-height: 1.65;
    color: var(--ink-soft);
    margin: 0;
  }
  .redline-sample-para .strike {
    text-decoration: line-through;
    text-decoration-color: var(--redline);
    text-decoration-thickness: 2px;
    color: var(--ink);
  }
  .redline-sample-para .hl {
    background: rgba(224,188,93,0.36);
    padding: 0 2px;
  }
  .redline-sample-para .anchor {
    position: relative;
    border-bottom: 2px solid var(--redline);
    cursor: pointer;
  }
  .redline-sample-findings {
    padding: 32px 24px;
    background: var(--vellum-soft);
    display: flex; flex-direction: column; gap: 18px;
  }
  .findings-head {
    display: flex; align-items: baseline; justify-content: space-between;
    padding-bottom: 12px; border-bottom: 1px solid var(--rule-soft);
  }
  .findings-head .label { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); }
  .findings-head .count { font-family: var(--serif); font-size: 22px; }
  .finding {
    padding: 14px; background: var(--white); border: 1px solid var(--rule-soft);
    position: relative;
  }
  .finding.high { border-left: 3px solid var(--redline); }
  .finding.medium { border-left: 3px solid var(--highlighter); }
  .finding.low { border-left: 3px solid var(--sage); }
  .finding-head {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px;
  }
  .finding-cat { font-family: var(--mono); font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink); }
  .finding-sev { font-family: var(--mono); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
  .finding.high .finding-sev { color: var(--redline); }
  .finding.medium .finding-sev { color: #9C7A2A; }
  .finding.low .finding-sev { color: var(--sage); }
  .finding-explain { font-size: 13px; line-height: 1.5; color: var(--ink-soft); }
  .finding-ref { font-family: var(--mono); font-size: 10.5px; color: var(--ink-mute); margin-top: 8px; letter-spacing: 0.02em; }

  /* =========================================================
     Section headers (with section number)
     ========================================================= */
  .sec-head {
    margin-bottom: 56px;
    border-bottom: 1px solid var(--rule-soft);
    padding-bottom: 24px;
    max-width: 720px;
  }
  .sec-head-body h2 {
    font-family: var(--serif);
    font-size: clamp(32px, 4vw, 44px);
    letter-spacing: -0.015em;
    line-height: 1.05;
    margin: 8px 0 16px;
    max-width: 20ch;
  }
  .sec-head-body .lede {
    font-size: 16px; line-height: 1.55; color: var(--ink-soft);
    max-width: 56ch;
  }

  /* =========================================================
     How-it-works
     ========================================================= */
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 40px; }
  .step { border-top: 1px solid var(--ink); padding-top: 20px; }
  .step .num { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: 0.08em; color: var(--ink-mute); }
  .step h3 { font-family: var(--serif); font-size: 24px; margin: 0 0 10px; letter-spacing: -0.01em; line-height: 1.15; }
  .step p { font-size: 15px; color: var(--ink-soft); line-height: 1.55; margin: 0; }

  /* =========================================================
     What we catch — feature grid using real categories
     ========================================================= */
  .catches { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0; border-top: 1px solid var(--rule-soft); }
  .catch {
    padding: 32px 28px;
    border-bottom: 1px solid var(--rule-soft);
    border-right: 1px solid var(--rule-soft);
  }
  .catch:nth-child(2n) { border-right: 0; }
  .catch:nth-last-child(-n+2) { border-bottom: 0; }
  .catch-num { font-family: var(--mono); font-size: 12px; font-weight: 600; color: var(--redline); letter-spacing: 0.06em; padding-top: 3px; }
  .catch h4 { font-family: var(--serif); font-size: 20px; margin: 0 0 8px; letter-spacing: -0.01em; }
  .catch p { font-size: 14.5px; color: var(--ink-soft); line-height: 1.55; margin: 0; }
  .catch-example {
    margin-top: 12px; padding: 10px 12px; background: var(--vellum-soft); border-left: 2px solid var(--rule);
    font-family: var(--serif); font-size: 13.5px; font-style: italic; color: var(--ink-soft); line-height: 1.45;
  }

  /* =========================================================
     Editorial two-column block
     ========================================================= */
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: start; }
  .two-col .primary h2 {
    font-family: var(--serif); font-size: clamp(30px, 3.6vw, 42px);
    letter-spacing: -0.015em; line-height: 1.05; margin: 12px 0 20px;
  }
  .two-col .primary p { font-size: 16.5px; line-height: 1.6; color: var(--ink-soft); margin: 0 0 16px; }
  .two-col .secondary { border-top: 2px solid var(--ink); padding-top: 24px; }
  .two-col .secondary dl { margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 12px 24px; }
  .two-col .secondary dt { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute); padding-top: 2px; }
  .two-col .secondary dd { margin: 0; font-size: 15px; color: var(--ink); line-height: 1.5; }

  /* =========================================================
     Pricing
     ========================================================= */
  .plans { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0; border: 1px solid var(--rule); background: var(--page); }
  .plan { padding: 32px 24px; border-right: 1px solid var(--rule-soft); display: flex; flex-direction: column; }
  .plan:last-child { border-right: 0; }
  .plan.feature { background: var(--aubergine); color: var(--vellum-soft); }
  .plan .plan-name { font-family: var(--mono); font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-mute); margin-bottom: 14px; }
  .plan.feature .plan-name { color: var(--vellum-warm); }
  .plan .plan-price { font-family: var(--serif); display: baseline; margin-bottom: 4px; }
  .plan .plan-price .amt { font-size: 46px; line-height: 1; letter-spacing: -0.02em; }
  .plan .plan-price .cyc { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--ink-mute); margin-left: 6px; }
  .plan.feature .plan-price .cyc { color: var(--vellum-warm); }
  .plan .plan-tagline { font-family: var(--serif); font-style: italic; font-size: 16px; color: var(--ink-soft); margin: 4px 0 24px; }
  .plan.feature .plan-tagline { color: var(--vellum-warm); }
  .plan .plan-cta { margin-bottom: 24px; }
  .plan ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .plan li { font-size: 14px; color: var(--ink-soft); display: grid; grid-template-columns: 16px 1fr; gap: 10px; align-items: baseline; line-height: 1.45; }
  .plan.feature li { color: var(--vellum-warm); }
  .plan li::before { content: '§'; font-family: var(--serif); font-size: 14px; color: var(--redline); font-weight: 500; }
  .plan.feature li::before { color: var(--highlighter); }

  /* =========================================================
     FAQ
     ========================================================= */
  .faq { border-top: 1px solid var(--ink); }
  .faq-item { border-bottom: 1px solid var(--rule-soft); }
  .faq-q {
    width: 100%; text-align: left; padding: 22px 0;
    display: flex; align-items: baseline; gap: 24px;
    font-family: var(--serif); font-size: 21px; letter-spacing: -0.005em;
    transition: color .15s ease;
  }
  .faq-q .q-num { font-family: var(--mono); font-size: 12px; color: var(--ink-mute); flex: 0 0 auto; letter-spacing: 0.06em; }
  .faq-q .q-text { flex: 1; }
  .faq-q .q-toggle { flex: 0 0 auto; font-family: var(--mono); font-size: 14px; color: var(--ink-mute); }
  .faq-q:hover { color: var(--redline); }
  .faq-a { display: none; padding: 0 0 22px 0; max-width: 60ch; font-size: 15.5px; line-height: 1.6; color: var(--ink-soft); }
  .faq-item.open .faq-a { display: block; }
  .faq-item.open .q-toggle::before { content: '−'; }
  .faq-item .q-toggle::before { content: '+'; }

  /* =========================================================
     CTA band
     ========================================================= */
  .cta-band {
    background: var(--aubergine);
    color: var(--vellum-soft);
    padding: clamp(72px, 10vw, 112px) 0;
    text-align: center;
  }
  .cta-band h2 {
    font-family: var(--serif); font-size: clamp(36px, 5vw, 60px);
    letter-spacing: -0.02em; line-height: 1.05; margin: 0 0 20px;
    max-width: 20ch; margin-left: auto; margin-right: auto;
  }
  .cta-band h2 em { font-style: italic; color: var(--redline); font-weight: 400; }
  .cta-band p { font-size: 17px; color: var(--vellum-warm); max-width: 560px; margin: 0 auto 36px; line-height: 1.5; }

  /* =========================================================
     Footer
     ========================================================= */
  footer { background: var(--vellum-soft); padding: 64px 0 32px; border-top: 1px solid var(--rule-soft); }
  .footer-inner { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr; gap: 60px; margin-bottom: 56px; }
  .footer-brand-block .tagline { color: var(--ink-mute); font-size: 14px; margin-top: 14px; max-width: 30ch; line-height: 1.5; }
  .footer-col h5 { font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-mute); margin: 0 0 16px; font-weight: 600; }
  .footer-col ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }
  .footer-col li a { font-size: 14px; color: var(--ink-soft); }
  .footer-col li a:hover { color: var(--redline); }
  .footer-bottom {
    padding-top: 24px; border-top: 1px solid var(--rule-soft);
    display: flex; justify-content: space-between; align-items: center;
    font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-mute);
  }

  /* =========================================================
     Auth screens
     ========================================================= */
  .auth-shell {
    min-height: 100vh; display: grid; grid-template-columns: 1fr 1fr;
    background: var(--vellum);
  }
  .auth-left {
    background: var(--aubergine); color: var(--vellum-soft);
    padding: 48px; display: flex; flex-direction: column; justify-content: space-between;
    position: relative; overflow: hidden;
  }
  .auth-left::after {
    content: ''; position: absolute; inset: 0;
    background: radial-gradient(circle at 20% 100%, rgba(185,74,52,0.08), transparent 50%);
    pointer-events: none;
  }
  .auth-left-inner { position: relative; z-index: 1; max-width: 480px; }
  .auth-left h2 {
    font-family: var(--serif); font-size: clamp(32px, 3.5vw, 44px);
    letter-spacing: -0.018em; line-height: 1.05; margin: 40px 0 20px;
  }
  .auth-left h2 em { color: var(--redline); font-style: italic; font-weight: 400; }
  .auth-left .quote { font-family: var(--serif); font-size: 18px; line-height: 1.5; color: var(--vellum-warm); font-style: italic; }
  .auth-left .quote-attr { font-family: var(--mono); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--vellum-warm); opacity: .7; margin-top: 12px; }
  .auth-right { padding: 48px; display: flex; flex-direction: column; justify-content: center; }
  .auth-form { max-width: 400px; width: 100%; margin: 0 auto; }
  .auth-form h1 { font-family: var(--serif); font-size: 34px; letter-spacing: -0.015em; margin: 0 0 8px; }

<div id="app-root"></div>

<script type="module">
/* ===========================================================
   State
   =========================================================== */
const state = {
  user: null,          // { uid, email, displayName }
  mode: 'demo',        // 'live' or 'demo'
  route: null,
  contracts: [],       // in-memory cache; also persisted (localStorage in demo, Firestore in live)
  currentContract: null,
  fbApp: null,
  fbAuth: null,
  fbDb: null,
  geminiKey: localStorage.getItem('cp_gemini_key') || '',
  fbConfig: null,      // set on live init
  pdfjs: null,
  toast: null,
};

/* ===========================================================
   Firebase config — user fills this in via Settings or hard-codes
   Leaving empty defaults to demo mode
   =========================================================== */
const FIREBASE_CONFIG = (() => {
  try {
    const stored = localStorage.getItem('cp_fb_config');
    if (stored) return JSON.parse(stored);
  } catch (e) {}
  return null;
})();

/* ===========================================================
   Router (hash-based)
   =========================================================== */
const routes = [
  { pattern: /^\/?$/, view: 'landing', auth: false },
  { pattern: /^\/signin$/, view: 'signin', auth: false },
  { pattern: /^\/signup$/, view: 'signup', auth: false },
  { pattern: /^\/reset$/, view: 'reset', auth: false },
  { pattern: /^\/pricing$/, view: 'landing', auth: false, hash: 'pricing' },
  { pattern: /^\/features$/, view: 'landing', auth: false, hash: 'catches' },
  { pattern: /^\/how$/, view: 'landing', auth: false, hash: 'how' },
  { pattern: /^\/faq$/, view: 'landing', auth: false, hash: 'faq' },
  { pattern: /^\/legal\/(.+)$/, view: 'legal', auth: false },
  { pattern: /^\/app\/?$/, view: 'dashboard', auth: true },
  { pattern: /^\/app\/new$/, view: 'newReview', auth: true },
  { pattern: /^\/app\/review\/(.+)$/, view: 'reviewPage', auth: true, param: 'id' },
  { pattern: /^\/app\/settings$/, view: 'settings', auth: true },
];

function currentRoute() {
  const raw = location.hash.replace(/^#/, '') || '/';
  for (const r of routes) {
    const m = raw.match(r.pattern);
    if (m) return { ...r, match: m, raw };
  }
  return { view: 'landing', auth: false, raw };
}

function navigate(path) { location.hash = path; }

function render() {
  const r = currentRoute();
  state.route = r;
  if (r.auth && !state.user) { navigate('/signin'); return; }
  const root = document.getElementById('app-root');

  const views = {
    landing: viewLanding,
    signin: viewSignin,
    signup: viewSignup,
    reset: viewReset,
    dashboard: viewDashboard,
    newReview: viewNewReview,
    reviewPage: viewReviewPage,
    settings: viewSettings,
    legal: viewLegal,
  };
  const fn = views[r.view] || viewLanding;
  root.innerHTML = fn(r);

  // After DOM insert, bind
  bindGlobal();
  if (r.view === 'landing') bindLanding();
  if (['signin','signup','reset'].includes(r.view)) bindAuth(r.view);
  if (r.view === 'dashboard') bindDashboard();
  if (r.view === 'newReview') bindNewReview();
  if (r.view === 'reviewPage') bindReviewPage(r);
  if (r.view === 'settings') bindSettings();

  // Anchor scroll for landing sub-routes
  if (r.hash) {
    requestAnimationFrame(() => {
      const el = document.getElementById(r.hash);
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  } else {
    window.scrollTo(0, 0);
  }
}

/* ===========================================================
   Firebase (dynamic import w/ fallback)
   =========================================================== */
async function initFirebase() {
  if (!FIREBASE_CONFIG) { state.mode = 'demo'; return; }
  try {
    const [{ initializeApp }, auth, fs] = await Promise.all([
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js'),
      import('https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js'),
    ]);
    state.fbApp = initializeApp(FIREBASE_CONFIG);
    state.fbAuth = auth.getAuth(state.fbApp);
    state.fbDb = fs.getFirestore(state.fbApp);
    state.mode = 'live';
    state.firebase = { auth, fs };
    auth.onAuthStateChanged(state.fbAuth, async (u) => {
      if (u) {
        state.user = { uid: u.uid, email: u.email, displayName: u.displayName || u.email.split('@')[0] };
        await loadContracts();
      } else {
        state.user = null;
        state.contracts = [];
      }
      render();
    });
  } catch (e) {
    console.warn('Firebase failed to load — running in demo mode', e);
    state.mode = 'demo';
    initDemoAuth();
  }
}

function initDemoAuth() {
  const stored = localStorage.getItem('cp_demo_user');
  if (stored) {
    state.user = JSON.parse(stored);
    loadContracts();
  }
}

/* ===========================================================
   Auth actions
   =========================================================== */
async function signIn(email, password) {
  if (state.mode === 'live') {
    const { signInWithEmailAndPassword } = state.firebase.auth;
    const cred = await signInWithEmailAndPassword(state.fbAuth, email, password);
    return cred.user;
  } else {
    const stored = JSON.parse(localStorage.getItem('cp_demo_accounts') || '{}');
    const acct = stored[email.toLowerCase()];
    if (!acct) throw new Error('No account found with that email.');
    if (acct.password !== password) throw new Error('That password is incorrect.');
    state.user = { uid: acct.uid, email: acct.email, displayName: acct.displayName };
    localStorage.setItem('cp_demo_user', JSON.stringify(state.user));
    await loadContracts();
    return state.user;
  }
}

async function signUp(name, email, password) {
  if (state.mode === 'live') {
    const { createUserWithEmailAndPassword, updateProfile } = state.firebase.auth;
    const cred = await createUserWithEmailAndPassword(state.fbAuth, email, password);
    if (name) await updateProfile(cred.user, { displayName: name });
    return cred.user;
  } else {
    const stored = JSON.parse(localStorage.getItem('cp_demo_accounts') || '{}');
    if (stored[email.toLowerCase()]) throw new Error('An account with that email already exists.');
    const uid = 'demo_' + Math.random().toString(36).slice(2, 10);
    stored[email.toLowerCase()] = { uid, email, password, displayName: name || email.split('@')[0] };
    localStorage.setItem('cp_demo_accounts', JSON.stringify(stored));
    state.user = { uid, email, displayName: name || email.split('@')[0] };
    localStorage.setItem('cp_demo_user', JSON.stringify(state.user));
    await loadContracts();
    return state.user;
  }
}

async function signOut() {
  if (state.mode === 'live') {
    await state.firebase.auth.signOut(state.fbAuth);
  } else {
    localStorage.removeItem('cp_demo_user');
    state.user = null;
    state.contracts = [];
  }
  navigate('/');
  render();
}

async function resetPassword(email) {
  if (state.mode === 'live') {
    const { sendPasswordResetEmail } = state.firebase.auth;
    await sendPasswordResetEmail(state.fbAuth, email);
  } else {
    // demo mode — pretend we sent
    await new Promise(r => setTimeout(r, 600));

/* ===========================================================
   Contracts store
   =========================================================== */
async function loadContracts() {
  if (!state.user) { state.contracts = []; return; }
  if (state.mode === 'live') {
    try {
      const { collection, query, where, orderBy, getDocs } = state.firebase.fs;
      const q = query(collection(state.fbDb, 'contracts'), where('ownerUid', '==', state.user.uid), orderBy('createdAt', 'desc'));
      const snap = await getDocs(q);
      state.contracts = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    } catch (e) {
      console.error('Failed to load contracts', e);
      state.contracts = [];
    }
  } else {
    const key = 'cp_demo_contracts_' + state.user.uid;
    state.contracts = JSON.parse(localStorage.getItem(key) || '[]');
  }
}

async function saveContract(contract) {
  if (state.mode === 'live') {
    const { collection, addDoc, serverTimestamp } = state.firebase.fs;
    const docRef = await addDoc(collection(state.fbDb, 'contracts'), {
      ...contract,
      ownerUid: state.user.uid,
      createdAt: serverTimestamp(),
    });
    return { id: docRef.id, ...contract, createdAt: new Date().toISOString() };
  } else {
    const key = 'cp_demo_contracts_' + state.user.uid;
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    const record = {
      id: 'c_' + Math.random().toString(36).slice(2, 10),
      ownerUid: state.user.uid,
      ...contract,
      createdAt: new Date().toISOString(),
    };
    list.unshift(record);
    localStorage.setItem(key, JSON.stringify(list));
    state.contracts = list;
    return record;
  }
}

async function fetchContract(id) {
  if (state.mode === 'live') {
    const { doc, getDoc } = state.firebase.fs;
    const snap = await getDoc(doc(state.fbDb, 'contracts', id));
    if (!snap.exists()) return null;
    const data = { id: snap.id, ...snap.data() };
    if (data.ownerUid !== state.user.uid) return null;
    return data;
  } else {
    const key = 'cp_demo_contracts_' + state.user.uid;
    const list = JSON.parse(localStorage.getItem(key) || '[]');
    return list.find(c => c.id === id) || null;
  }
}

async function deleteContract(id) {
  if (state.mode === 'live') {
    const { doc, deleteDoc } = state.firebase.fs;
    await deleteDoc(doc(state.fbDb, 'contracts', id));
  } else {
    const key = 'cp_demo_contracts_' + state.user.uid;
    let list = JSON.parse(localStorage.getItem(key) || '[]');
    list = list.filter(c => c.id !== id);
    localStorage.setItem(key, JSON.stringify(list));
    state.contracts = list;
  }
}

/* ===========================================================
   PDF text extraction (lazy pdf.js)
   =========================================================== */
async function loadPdfJs() {
  if (state.pdfjs) return state.pdfjs;
  try {
    const mod = await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.min.mjs');
    mod.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.0.379/pdf.worker.min.mjs';
    state.pdfjs = mod;
    return mod;
  } catch (e) {
    throw new Error('Could not load PDF parser. Please paste the contract text instead.');
  }
}

async function extractPdfText(file) {
  const pdfjs = await loadPdfJs();
  const buf = await file.arrayBuffer();
  const pdf = await pdfjs.getDocument({ data: buf }).promise;
  let text = '';
  for (let i = 1; i <= pdf.numPages; i++) {
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const strings = content.items.map(it => it.str);
    text += strings.join(' ') + '\n\n';
  }
  return text.trim();
}

/* ===========================================================
   Gemini API
   =========================================================== */
async function callGemini(prompt) {
  if (!state.geminiKey) throw new Error('No Gemini API key configured. Add one in Settings.');
  const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash-latest:generateContent?key=${encodeURIComponent(state.geminiKey)}`;
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      contents: [{ parts: [{ text: prompt }] }],
      generationConfig: { temperature: 0.2, maxOutputTokens: 4096, responseMimeType: 'application/json' },
    }),
  });
  if (!res.ok) {
    const err = await res.text();
    throw new Error('Gemini API error: ' + err.slice(0, 200));
  }
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
  return text;
}

const RISK_CATEGORIES = [
  { key: 'auto-renewal', label: 'Auto-renewal' },
  { key: 'termination', label: 'Termination' },
  { key: 'liability', label: 'Liability' },
  { key: 'indemnity', label: 'Indemnity' },
  { key: 'ip', label: 'IP & Ownership' },
  { key: 'confidentiality', label: 'Confidentiality' },
  { key: 'payment', label: 'Payment terms' },
  { key: 'sla', label: 'SLA' },
  { key: 'jurisdiction', label: 'Jurisdiction' },
  { key: 'assignment', label: 'Assignment' },
  { key: 'missing', label: 'Missing clause' },
  { key: 'unusual', label: 'Unusual language' },
  { key: 'obligation', label: 'Obligation' },
];

async function analyzeContract(text) {
  if (state.geminiKey) {
    try {
      const prompt = buildAnalysisPrompt(text);
      const jsonStr = await callGemini(prompt);
      const parsed = JSON.parse(jsonStr);
      // Validate + normalize
      const findings = (parsed.findings || []).map((f, i) => normalizeFinding(f, i, text));
      return {
        title: parsed.title || 'Untitled contract',
        summary: parsed.summary || '',
        counterparty: parsed.counterparty || '',
        docType: parsed.docType || 'Agreement',
        findings,
      };
    } catch (e) {
      console.warn('Gemini analysis failed, falling back to heuristic', e);
      showToast('Analysis failed — showing example findings. Check your API key in Settings.', 'error');
      return heuristicAnalyze(text);
    }
  }
  return heuristicAnalyze(text);
}

function buildAnalysisPrompt(text) {
  const cats = RISK_CATEGORIES.map(c => c.key).join(', ');
  return `You are a senior contracts attorney reviewing an agreement for a business team. Read the contract text below and return a JSON object identifying every clause that is a risk, missing, unusual, or worth flagging.

Return VALID JSON only. Do not include any prose outside the JSON. Schema:
{
  "title": "short document title, e.g. 'Master Services Agreement'",
  "docType": "one of: NDA, MSA, SOW, SaaS Agreement, Employment, Lease, Vendor Agreement, License, Terms of Service, Other",
  "counterparty": "the other party's name if identifiable, else empty string",
  "summary": "2–3 sentence plain-English summary of what this contract is and its main commitments",
  "findings": [
    {
      "category": "one of: ${cats}",
      "severity": "high | medium | low",
      "title": "5–8 word finding title, e.g. 'Auto-renews for 12 months'",
      "quote": "the EXACT text from the contract that this finding refers to (10–150 words, verbatim). Must appear in the contract text.",
      "sectionRef": "section number or heading if present, e.g. 'Section 8.2' or 'Clause 14', else empty string",
      "explanation": "2–3 sentence plain-English explanation of what this means for the business",
      "suggestion": "1–2 sentence concrete suggestion for what to negotiate or ask about"
    }
  ]
}

Severity guidance:
- high: creates real business risk (unlimited liability, one-sided indemnity, auto-renewal >6 months with tight notice, aggressive IP assignment, exclusivity, broad non-competes)
- medium: worth pushing back on (short cure periods, uncapped fees, vague SLAs, unusual jurisdiction, broad confidentiality)
- low: worth being aware of but common/acceptable (standard force majeure, boilerplate that could be tightened)

Also flag as "missing" category anything that's conspicuously absent for this document type (e.g. an MSA with no limitation of liability clause).

Aim for 4–12 findings depending on contract length. Focus on the most consequential items.

Contract text:
"""
${text.slice(0, 30000)}
"""`;
}

function normalizeFinding(f, i, text) {
  const sev = ['high','medium','low'].includes(f.severity) ? f.severity : 'medium';
  const cat = RISK_CATEGORIES.find(c => c.key === f.category)?.label || (f.category || 'Unusual language');
  return {
    id: 'f_' + i + '_' + Math.random().toString(36).slice(2, 7),
    category: cat,
    categoryKey: f.category || 'unusual',
    severity: sev,
    title: (f.title || '').trim() || 'Flagged clause',
    quote: (f.quote || '').trim(),
    sectionRef: (f.sectionRef || '').trim(),
    explanation: (f.explanation || '').trim(),
    suggestion: (f.suggestion || '').trim(),
  };
}

/* Heuristic fallback so demo mode always shows a plausible result */
function heuristicAnalyze(text) {
  const t = text || '';
  const findings = [];
  let idx = 0;

  const push = (categoryKey, category, severity, title, quote, sectionRef, explanation, suggestion) => {
    findings.push({
      id: 'f_' + (idx++) + '_' + Math.random().toString(36).slice(2, 7),
      category, categoryKey, severity, title,
      quote, sectionRef, explanation, suggestion,
    });
  };

  // Auto-renewal detection
  const arMatch = t.match(/(?:auto(?:matically)?\s+renew|automatic\s+renewal|shall\s+renew)[^.]{0,300}\./i);
  if (arMatch) {
    push('auto-renewal', 'Auto-renewal', 'high',
      'Auto-renewal with short notice window',
      arMatch[0].trim(),
      findSectionRef(t, arMatch.index),
      "This contract renews automatically unless you cancel within a set notice window. Miss it and you're locked in for another term.",
      "Negotiate the notice window down to 30 days, or require the other party to send a renewal reminder before it triggers.");
  }

  // Liability cap
  const liabMatch = t.match(/(?:limitation\s+of\s+liability|total\s+liability|aggregate\s+liability|liability[^.]{0,60}shall\s+(?:not|be))[^.]{0,300}\./i);
  if (liabMatch) {
    push('liability', 'Liability', 'medium',
      'Liability capped at fees paid',
      liabMatch[0].trim(),
      findSectionRef(t, liabMatch.index),
      "Your maximum recovery is limited — often to fees paid in the last 12 months. If the counterparty causes a much larger loss, you can't recover the difference.",
      "Push to exclude gross negligence, wilful misconduct, breach of confidentiality, and IP indemnity from the cap.");
  } else if (t.length > 1500) {
    push('missing', 'Missing clause', 'high',
      'No limitation of liability',
      '',
      '',
      "There's no cap or floor on either party's liability. In most B2B agreements this is standard — its absence exposes you to unlimited damages.",
      "Ask for a mutual cap at fees paid in the trailing 12 months, with standard carve-outs.");
  }

  // Indemnification
  const idemMatch = t.match(/(?:shall\s+indemnify|agrees\s+to\s+indemnify|hold\s+harmless)[^.]{0,300}\./i);
  if (idemMatch) {
    push('indemnity', 'Indemnity', 'medium',
      'One-way indemnity obligation',
      idemMatch[0].trim(),
      findSectionRef(t, idemMatch.index),
      "You're agreeing to defend and pay damages for claims arising from your acts or products. Check whether the obligation is mutual and what it covers.",
      "Make the indemnity mutual and limit it to third-party claims — not internal disputes between the two parties.");
  }

  // Termination for convenience
  const termMatch = t.match(/(?:terminat(?:e|ion)\s+for\s+convenience|terminat(?:e|ion)\s+without\s+cause)[^.]{0,300}\./i);
  if (termMatch) {
    push('termination', 'Termination', 'medium',
      'Termination for convenience by counterparty',
      termMatch[0].trim(),
      findSectionRef(t, termMatch.index),
      "The other side can end this agreement at any time for any reason, with the specified notice. If you've built work around this, you're exposed to a sudden loss.",
      "Require mutual termination-for-convenience rights, and add a wind-down or refund provision for prepaid fees.");
  }

  // IP assignment
  const ipMatch = t.match(/(?:intellectual\s+property|work\s+product|deliverables)[^.]{0,80}(?:assign|assigned|transfer|belong)[^.]{0,200}\./i);
  if (ipMatch) {
    push('ip', 'IP & Ownership', 'high',
      'Broad IP assignment',
      ipMatch[0].trim(),
      findSectionRef(t, ipMatch.index),
      "Ownership of deliverables and related IP transfers to one party. Check whether this includes your background IP or general tools you use across clients.",
      "Carve out background IP and general know-how; scope the assignment to specific deliverables only, not tooling.");
  }

  // Confidentiality
  const confMatch = t.match(/(?:confidential\s+information|non-disclosure)[^.]{0,200}\./i);
  if (confMatch) {
    push('confidentiality', 'Confidentiality', 'low',
      'Standard confidentiality with no term',
      confMatch[0].trim(),
      findSectionRef(t, confMatch.index),
      "The confidentiality obligations here may extend indefinitely. That's common for trade secrets but unusually broad for ordinary business information.",
      "Add a 3–5 year survival window for non-trade-secret information; keep the perpetual obligation for trade secrets only.");
  }

  // Payment terms
  const payMatch = t.match(/(?:payment\s+shall\s+be|invoices?\s+shall\s+be\s+paid|net\s+\d+|due\s+within\s+\d+)[^.]{0,200}\./i);
  if (payMatch) {
    push('payment', 'Payment terms', 'low',
      'Net-30 with late fees',
      payMatch[0].trim(),
      findSectionRef(t, payMatch.index),
      "Standard payment window with an interest charge on late invoices. Check whether the late fee compounds and whether it exceeds usury limits in your jurisdiction.",
      "If you're the payer, ask for a 5-business-day cure period before late fees apply.");
  }

  // Jurisdiction
  const jurMatch = t.match(/(?:governed\s+by\s+the\s+laws\s+of|jurisdiction\s+of)[^.]{0,200}\./i);
  if (jurMatch) {
    push('jurisdiction', 'Jurisdiction', 'low',
      'Governing law favours counterparty',
      jurMatch[0].trim(),
      findSectionRef(t, jurMatch.index),
      "Disputes will be resolved under a jurisdiction that may not be convenient or familiar to you. Enforcement and legal fees are typically higher outside your home jurisdiction.",
      "Propose mutual jurisdiction (each party in the other's home court), or arbitration in a neutral seat like London or Singapore.");
  }

  // If we found nothing at all, seed some example findings so demo mode always produces output
  if (findings.length === 0) {
    push('auto-renewal', 'Auto-renewal', 'high',
      'Locked-in renewal cycle',
      text.slice(0, 200) || 'No matching clause language found in the sample.',
      '',
      "The contract appears to renew automatically. Confirm the notice window and whether it can be shortened.",
      "Ask for a 30-day notice window and a written reminder before the renewal date.");
    push('missing', 'Missing clause', 'medium',
      'No termination assistance clause',
      '',
      '',
      "There's no obligation for the other party to help you transition off if the contract ends. This is common in vendor and SaaS agreements.",
      "Add a 30–90 day transition assistance period at agreed rates, with data return and deletion obligations.");
  }

  const title = extractTitle(t);
  const docType = guessDocType(t);
  const counterparty = extractCounterparty(t);
  const summary = buildSummary(t, docType, counterparty, findings.length);

  return { title, docType, counterparty, summary, findings };
}

function findSectionRef(text, idx) {
  const window = text.slice(Math.max(0, idx - 300), idx);
  const m = window.match(/(?:Section|Clause|Article|§)\s*\d+(\.\d+)*/gi);
  return m ? m[m.length - 1] : '';
}
function extractTitle(t) {
  const first = t.slice(0, 500).split('\n').map(l => l.trim()).filter(Boolean);
  const upper = first.find(l => l.length > 6 && l.length < 80 && l.replace(/[^A-Za-z]/g, '').length > 5 && l === l.toUpperCase());
  if (upper) return toTitleCase(upper);
  return first[0] ? (first[0].length > 60 ? first[0].slice(0, 60) + '…' : first[0]) : 'Untitled contract';
}
function toTitleCase(s) { return s.toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
function guessDocType(t) {
  const l = t.toLowerCase();
  if (/master\s+services?\s+agreement|\bmsa\b/.test(l)) return 'MSA';
  if (/non[-\s]?disclosure|confidentiality\s+agreement|\bnda\b/.test(l)) return 'NDA';
  if (/statement\s+of\s+work|\bsow\b/.test(l)) return 'SOW';
  if (/software[-\s]as[-\s]a[-\s]service|saas\s+agreement|subscription\s+agreement/.test(l)) return 'SaaS Agreement';
  if (/employment|employee\s+agreement/.test(l)) return 'Employment';
  if (/lease|tenanc/.test(l)) return 'Lease';
  if (/vendor|supplier/.test(l)) return 'Vendor Agreement';
  if (/license|licence/.test(l)) return 'License';
  if (/terms\s+of\s+service|terms\s+and\s+conditions/.test(l)) return 'Terms of Service';
  return 'Agreement';
}
function extractCounterparty(t) {
  const m = t.match(/between\s+([A-Z][A-Za-z0-9&., ]{2,60}(?:Inc\.?|Ltd\.?|LLC|Limited|Corp\.?|GmbH|PLC))/);
  if (m) return m[1].trim();
  return '';
}
function buildSummary(t, docType, counterparty, findingCount) {
  const cp = counterparty ? ` with ${counterparty}` : '';
  return `This ${docType}${cp} runs approximately ${Math.round(t.length / 5)} words. Contractpilot flagged ${findingCount} item${findingCount === 1 ? '' : 's'} across obligations, risks, and missing terms worth reviewing before signature.`;
}

/* ===========================================================
   Highlighting — find each finding's quote in the text
   =========================================================== */
function buildHighlightedText(text, findings) {
  if (!findings || findings.length === 0) return escapeHtml(text);
  const spans = [];
  for (const f of findings) {
    if (!f.quote) continue;
    const idx = text.indexOf(f.quote.slice(0, 80));
    if (idx >= 0) {
      const end = Math.min(text.length, idx + f.quote.length);
      spans.push({ start: idx, end, id: f.id, sev: f.severity });
    }
  }
  spans.sort((a, b) => a.start - b.start);
  // Resolve overlaps: keep first, drop overlapping
  const clean = [];
  for (const s of spans) {
    if (clean.length === 0 || s.start >= clean[clean.length - 1].end) clean.push(s);
  }
  let out = '';
  let cursor = 0;
  for (const s of clean) {
    out += escapeHtml(text.slice(cursor, s.start));
    out += `<span class="highlight ${s.sev}" data-finding-id="${s.id}">${escapeHtml(text.slice(s.start, s.end))}</span>`;
    cursor = s.end;
  }
  out += escapeHtml(text.slice(cursor));
  return out;
}

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

    { q: 'How does it handle confidential contracts?', a: 'Contract text is sent to a large language model for analysis and stored in your workspace. You control who has access. On the Business and Firm plans, you can request a signed data processing agreement and configure retention policies. Nothing is used to train models. If your contracts are subject to specific confidentiality obligations, review the DPA before you upload — the same way you would for any SaaS tool.' },
    { q: 'What file formats work?', a: 'PDF and DOCX for uploads; plain text for paste. Scanned PDFs work if the text layer is present — for pure image PDFs, run OCR first (Adobe Acrobat, Preview on Mac, or free tools like ocr.space). We\'re adding OCR directly in the app soon.' },
    { q: 'What contract types does it review?', a: 'It works on any prose contract in English — MSAs, SOWs, NDAs, SaaS agreements, employment contracts, leases, vendor agreements, service agreements, licenses, terms of service. It does not do well on highly structured documents like leases with dense schedule tables, or contracts primarily written in other languages.' },

function bindAuth(kind) {
  const form = document.querySelector('[data-form]');
  if (!form) return;
  const errBox = form.querySelector('[data-error]');
  const okBox = form.querySelector('[data-success]');
  const submitBtn = form.querySelector('[data-submit]');

  const setErr = (msg) => {
    if (okBox) { okBox.hidden = true; okBox.textContent = ''; }
    if (msg) { errBox.hidden = false; errBox.textContent = msg; }
    else { errBox.hidden = true; errBox.textContent = ''; }
  };
  const setOk = (msg) => {
    setErr('');
    if (okBox) { okBox.hidden = false; okBox.textContent = msg; }
  };

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    setErr('');
    const data = Object.fromEntries(new FormData(form));
    const original = submitBtn.textContent;
    submitBtn.disabled = true; submitBtn.textContent = 'Working…';
    try {
      if (kind === 'signin') {
        await signIn(data.email.trim(), data.password);
        navigate('/app');
      } else if (kind === 'signup') {
        if (!data.email.trim() || !data.password || data.password.length < 8) throw new Error('Please enter a valid email and a password of at least 8 characters.');
        await signUp((data.name || '').trim(), data.email.trim(), data.password);
        navigate('/app');
      } else if (kind === 'reset') {
        if (!data.email.trim()) throw new Error('Please enter your email.');
        await resetPassword(data.email.trim());
        setOk('If an account exists for that email, we\'ve sent reset instructions.');
      }
    } catch (err) {
      setErr(cleanErr(err));
    } finally {
      submitBtn.disabled = false; submitBtn.textContent = original;
    }
  });
}

function cleanErr(err) {
  const msg = err?.message || String(err);
  if (msg.includes('auth/invalid-credential') || msg.includes('auth/wrong-password') || msg.includes('auth/user-not-found')) return 'That email and password don\'t match an account.';
  if (msg.includes('auth/email-already-in-use')) return 'An account with that email already exists.';
  if (msg.includes('auth/weak-password')) return 'Please choose a longer password (at least 8 characters).';
  if (msg.includes('auth/invalid-email')) return 'That doesn\'t look like a valid email address.';
  return msg.replace(/^Firebase:\s*/, '').replace(/\(auth\/[^)]+\)\.?/, '').trim();
}

function bindNewReview() {
  const fileInput = document.getElementById('file-input');
  const pickBtn = document.querySelector('[data-pickfile]');
  const dropzone = document.querySelector('[data-dropzone]');
  const analyzePasteBtn = document.querySelector('[data-analyze-paste]');
  const pasteBox = document.getElementById('paste-text');
  const uploadContainer = document.getElementById('upload-container');
  const analyzingContainer = document.getElementById('analyzing-container');

  const showAnalyzing = (title, msg, stage) => {
    uploadContainer.hidden = true;
    analyzingContainer.hidden = false;
    document.querySelector('[data-analyze-title]').textContent = title;
    document.querySelector('[data-analyze-msg]').textContent = msg;
    document.querySelector('[data-analyze-stage]').textContent = stage;
  };

  pickBtn?.addEventListener('click', () => fileInput.click());
  dropzone?.addEventListener('click', (e) => { if (e.target === dropzone || e.target.classList.contains('drop-mark')) fileInput.click(); });

  ;['dragover','dragenter'].forEach(ev => dropzone?.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.add('drag'); }));
  ;['dragleave','drop'].forEach(ev => dropzone?.addEventListener(ev, (e) => { e.preventDefault(); dropzone.classList.remove('drag'); }));
  dropzone?.addEventListener('drop', async (e) => {
    const f = e.dataTransfer.files?.[0];
    if (f) await handleFile(f);
  });
  fileInput?.addEventListener('change', async (e) => {
    const f = e.target.files?.[0];
    if (f) await handleFile(f);
  });

  analyzePasteBtn?.addEventListener('click', async () => {
    const text = pasteBox.value.trim();
    if (!text || text.length < 200) {
      showToast('Please paste at least a couple of paragraphs of contract text.', 'error');
      return;
    }
    await runAnalysis(text, 'Pasted contract', 'text/plain');
  });

  async function handleFile(file) {
    if (file.size > 10 * 1024 * 1024) {
      showToast('File too large — maximum 10 MB.', 'error');
      return;
    }
    try {
      showAnalyzing('Reading the file…', 'Extracting text from ' + file.name, 'Stage 1 of 3');
      let text = '';
      if (file.type === 'application/pdf' || /\.pdf$/i.test(file.name)) {
        text = await extractPdfText(file);
      } else if (/\.txt$/i.test(file.name)) {
        text = await file.text();
      } else if (/\.docx$/i.test(file.name)) {
        // Basic DOCX handling — extract text from document.xml
        text = await extractDocxText(file);
      } else {
        text = await file.text();
      }
      if (!text || text.trim().length < 100) throw new Error('Could not extract enough text from that file. Try pasting the contract text instead.');
      await runAnalysis(text, file.name, file.type);
    } catch (e) {
      uploadContainer.hidden = false;
      analyzingContainer.hidden = true;
      showToast(e.message || 'Failed to process that file.', 'error');
    }
  }

  async function runAnalysis(text, name, mime) {
    try {
      showAnalyzing('Reading every line…', 'Contractpilot is scanning for risks, missing terms, and unusual language.', 'Stage 2 of 3');
      const result = await analyzeContract(text);
      showAnalyzing('Preparing your review…', 'Almost done.', 'Stage 3 of 3');
      const record = await saveContract({
        title: result.title,
        docType: result.docType,
        counterparty: result.counterparty,
        summary: result.summary,
        findings: result.findings,
        text: text.slice(0, 100000),
        source: name,
        mime,
      });
      state.currentContract = record;
      showToast('Review ready — ' + result.findings.length + ' finding' + (result.findings.length === 1 ? '' : 's'), 'success');
      navigate('/app/review/' + record.id);
    } catch (e) {
      uploadContainer.hidden = false;
      analyzingContainer.hidden = true;
      showToast(e.message || 'Analysis failed.', 'error');
    }
  }
}

async function extractDocxText(file) {
  // DOCX is a zip; naive fallback: try to read plain text if possible, else warn
  try {
    const buf = await file.arrayBuffer();
    // Basic sniff for common DOCX text patterns
    const bytes = new Uint8Array(buf);
    // Look for XML text within the zip stream
    const decoder = new TextDecoder('utf-8', { fatal: false });
    const raw = decoder.decode(bytes);
    // Extract text between <w:t> tags if present
    const matches = raw.match(/<w:t[^>]*>([^<]*)<\/w:t>/g);
    if (matches && matches.length > 5) {
      return matches.map(m => m.replace(/<[^>]+>/g, '')).join(' ').replace(/\s+/g, ' ').trim();
    }
    throw new Error('No text found');
  } catch (e) {
    throw new Error('DOCX support is limited — please save the file as PDF or paste the text.');
  }
}

    render();
  });
  document.querySelector('[data-save-fb]')?.addEventListener('click', () => {
    const val = document.getElementById('fb-config').value.trim();
    if (!val) { showToast('Please paste your Firebase config JSON.', 'error'); return; }
    try {
      const parsed = JSON.parse(val);
      if (!parsed.apiKey || !parsed.projectId) throw new Error('Missing required Firebase config fields.');
      localStorage.setItem('cp_fb_config', JSON.stringify(parsed));
      showToast('Firebase config saved — reloading…', 'success');
      setTimeout(() => location.reload(), 800);
    } catch (e) {
      showToast('Invalid JSON: ' + e.message, 'error');
    }
  });
  document.querySelector('[data-clear-fb]')?.addEventListener('click', () => {
    localStorage.removeItem('cp_fb_config');
    showToast('Firebase disconnected — reloading…', 'success');
    setTimeout(() => location.reload(), 800);
  });
}

/* ===========================================================
   Init
   =========================================================== */
(async function init() {
  await initFirebase();
  render();
})();

</script>
</body>
</html>
